[package]
name = "keeler"
version = "0.1.0"
edition = "2021"
publish = false

# swap-sdk and swap-program come from the pinned examples checkout that
# scripts/setup.sh creates; run it before building. The spr-* and solana-*
# versions match that checkout's swap/xark/Cargo.toml.
[dependencies]
keeler-core = { path = "../core" }
# The lending program and its SDK (its own workspace in lend/): the keeper.
keeler-lend = { path = "../lend/program", features = ["circuits"] }
keeler-lend-sdk = { path = "../lend/sdk" }
sha2 = "0.10"
borsh = { version = "1.5", default-features = false, features = ["derive"] }
wincode = { version = "0.6", features = ["derive"] }
bincode = "1.3"
bs58 = "0.5"
base64 = "0.22"
getrandom = "0.2"
solana-signature = "3.5"
solana-transaction = { version = "4.3", features = ["serde"] }
swap-sdk = { path = "../.tools/privacy-ring-examples/swap/xark/sdk" }
swap-program = { path = "../.tools/privacy-ring-examples/swap/xark/program", features = ["circuits"] }
spr-client = { version = "0.10.0", features = ["reqwest", "solana-rpc"] }
spr-interface = "0.10.0"
spr-keypair = "0.10.0"
spr-program = { version = "0.10.0", features = ["client"] }
spr-transaction = "0.10.0"
spr-user-registry-interface = { version = "0.10.0", features = ["solana"] }
solana-address = { version = "2.7", features = ["atomic", "borsh", "bytemuck", "copy", "curve25519", "decode", "wincode"] }
solana-instruction = "3.4"
solana-keypair = "3.1.2"
solana-signer = "3.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0"

[dev-dependencies]
spr-program-test = { version = "0.10.0", features = ["localnet"] }
solana-account = "4.3"
solana-rpc-client = "4.3"
solana-rpc-client-api = "4.3"
