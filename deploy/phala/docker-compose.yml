services:
  dealer:
    image: ghcr.io/0xinbeta/keeler-keeper@sha256:c6024394deddceffa1854b3acad7adf6fa56a94007fdab7c8b7f79d1dd6c0c7c
    command: ["dealer", "/config/dealer.json"]
    restart: unless-stopped
    ports:
      - "47500:47500"
    volumes:
      - dealer-data:/data
    environment:
      - KEELER_DEALER_KEY=${KEELER_DEALER_KEY}
      - KEELER_POOL_KEY=${KEELER_POOL_KEY}
      - KEELER_HTTP_KEY=${KEELER_HTTP_KEY}
      - KEELER_FAUCET_KEY=${KEELER_FAUCET_KEY}
      - KEELER_HELIUS_KEY=${KEELER_HELIUS_KEY}
  standby:
    image: ghcr.io/0xinbeta/keeler-keeper@sha256:c6024394deddceffa1854b3acad7adf6fa56a94007fdab7c8b7f79d1dd6c0c7c
    command: ["keeper", "/config/standby.json"]
    restart: unless-stopped
    ports:
      - "47501:47501"
    volumes:
      - standby-data:/data
    environment:
      - KEELER_STANDBY_KEY=${KEELER_STANDBY_KEY}
      - KEELER_POOL_KEY=${KEELER_POOL_KEY}
      - KEELER_HTTP_KEY=${KEELER_HTTP_KEY}
      - KEELER_HELIUS_KEY=${KEELER_HELIUS_KEY}

volumes:
  dealer-data:
  standby-data:
