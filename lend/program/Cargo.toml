[package]
name = "keeler-lend"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
name = "keeler_lend"
crate-type = ["cdylib", "lib"]

[features]
# The committed verifying keys come from `zolana zk compile --test` (a fixed
# public seed): for local networks and devnet only, never mainnet.
default = ["insecure-test-setup"]
insecure-test-setup = []
# A keeper-set price account per vault, accepted in place of Pyth. Local
# networks and devnet only, passed explicitly (scripts/setup-lend.sh):
# `vaults.rs` refuses it without insecure-test-setup or with `mainnet`.
test-price = []
# Marks a mainnet build (`--no-default-features --features mainnet`): not
# with insecure-test-setup or test-price, and build.rs requires every build
# parameter set to a non-default value.
mainnet = []
bpf-entrypoint = []
# The circuits and their native execution, plus the client helpers.
circuits = ["dep:xark", "spr-program/client", "dep:spr-transaction", "dep:spr-keypair"]
# The browser package: `zolana zk compile --wasm-out`.
wasm = ["dep:xark", "spr-program/wasm", "dep:spr-transaction", "dep:spr-keypair"]
# Only while `zolana zk compile` discovers the programs.
build-circuits = ["circuits", "spr-program/build"]

[dependencies]
xark = { workspace = true, optional = true }
borsh = { workspace = true }
groth16-solana = { workspace = true, features = ["bsb22"] }
light-program-profiler = { workspace = true }
pinocchio = { workspace = true, features = ["cpi"] }
solana-address = { workspace = true, features = ["curve25519"] }
solana-program-error = { workspace = true }
wincode = { workspace = true }
spr-account-checks = { workspace = true }
spr-hasher = { workspace = true }
spr-interface = { workspace = true }
spr-program = { workspace = true, features = ["cpi", "compression", "verifier"] }

# Client-side only: a circuit build (cfg xark) can't link them.
[target.'cfg(all(not(xark), not(xark_client)))'.dependencies]
spr-keypair = { workspace = true, optional = true }
spr-transaction = { workspace = true, optional = true }

[dev-dependencies]
serde_json = "1"
mollusk-svm = { workspace = true }
solana-account = { workspace = true }
solana-instruction = { workspace = true }
solana-pubkey = { workspace = true }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(xark)',
    'cfg(xark_client)',
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("profile-heap"))',
]
