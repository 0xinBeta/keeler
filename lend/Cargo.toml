[workspace]
resolver = "2"
members = ["program", "spike"]

[workspace.package]
edition = "2021"

# The same pins as the swap example (.tools/privacy-ring-examples/swap/xark),
# built with the same zolana CLI (cli-v0.10.0).
[workspace.dependencies]
xark = "0.3.1"
xark-groth16 = "0.3.1"
spr-account-checks = { version = "0.10.0", default-features = false }
spr-client = { version = "0.10.0" }
spr-hasher = { version = "0.8.0", default-features = false }
spr-interface = { version = "0.10.0" }
spr-keypair = { version = "0.10.0" }
spr-program = { version = "0.10.0" }
spr-program-test = { version = "0.10.0" }
spr-transaction = { version = "0.10.0" }

groth16-solana = { version = "0.3.1", features = ["bsb22"] }
light-program-profiler = { git = "https://github.com/Lightprotocol/light-program-profiler", rev = "a9b6735c1cd252111fe07a1c93824158f658d530" }

anyhow = "1.0"
borsh = { version = "1.5", default-features = false, features = ["derive"] }
mollusk-svm = "0.16.4"
pinocchio = "0.11"
thiserror = "2.0"
wincode = { version = "0.6", features = ["derive"] }
solana-account = "4.3"
solana-address = { version = "2.7", features = ["atomic", "borsh", "bytemuck", "copy", "decode", "wincode"] }
solana-instruction = "3.4"
solana-keypair = "3.1.2"
solana-program-error = "3.0"
solana-pubkey = { version = "4.2", features = ["curve25519"] }
solana-signature = "3.4"
solana-signer = "3.0"

[profile.release]
overflow-checks = true
